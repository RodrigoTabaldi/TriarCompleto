<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-linecap:round;">
    <!-- Marca Triar (chevrons) recriada em vetor -->
    <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#38D9A0"/>
            <stop offset="1" stop-color="#2ECC8F"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#16B98A"/>
            <stop offset="1" stop-color="#0FAE7F"/>
        </linearGradient>
    </defs>
    <!-- ponto superior -->
    <circle cx="228" cy="78" r="44" fill="#2ECC8F"/>
    <!-- chevron largo -->
    <path d="M74,150 L228,262 L382,150" fill="none" stroke="url(#g1)" stroke-width="52"/>
    <!-- chevron menor -->
    <path d="M126,258 L228,332 L330,258" fill="none" stroke="url(#g2)" stroke-width="48"/>
    <!-- ponto inferior (navy) -->
    <circle cx="228" cy="398" r="28" fill="#123B3A"/>
</svg>
