name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test-api:
    name: Build + testes (Triagem.API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar (com lockfile)
        run: dotnet restore Triagem.API.Tests/Triagem.API.Tests.csproj --locked-mode

      - name: Build (Release)
        run: dotnet build Triagem.API.Tests/Triagem.API.Tests.csproj --no-restore -c Release

      - name: Testes
        run: dotnet test Triagem.API.Tests/Triagem.API.Tests.csproj --no-build -c Release --settings coverlet.runsettings --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Testes do núcleo compartilhado
        run: dotnet test Triagem.Core.Tests/Triagem.Core.Tests.csproj -c Release --logger "trx;LogFileName=core-test-results.trx"

      - name: Checar dependências com vulnerabilidades conhecidas
        run: dotnet list Triagem.API/Triagem.API/Triagem.API.csproj package --vulnerable --include-transitive

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml

  build-app-android:
    name: Build do app Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Restaurar app com lockfile
        run: dotnet restore Triagem.App/MauiApp3/MauiApp3.csproj --locked-mode -p:TargetFramework=net10.0-android

      - name: Compilar app Android
        run: dotnet build Triagem.App/MauiApp3/MauiApp3.csproj -f net10.0-android -c Debug --no-restore

      - name: Checar dependências do app
        run: dotnet list Triagem.App/MauiApp3/MauiApp3.csproj package --vulnerable --include-transitive

  secret-scan:
    name: Verificação de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
