name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Análise estática C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"
      - run: dotnet restore Triagem.API.Tests/Triagem.API.Tests.csproj --locked-mode
      - run: dotnet build Triagem.API.Tests/Triagem.API.Tests.csproj -c Release --no-restore
      - uses: github/codeql-action/analyze@v3
