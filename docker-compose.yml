# Arquitetura da Triar API
#
#   App MAUI ──► nginx (load balancer, porta 5036) ──► api1 / api2 (ASP.NET Core)
#                                                          │        │
#                                                          ▼        ▼
#                                                   PostgreSQL    Redis
#                                                     17        (cache)
#
# Subir tudo:  docker compose up -d --build
# A API fica disponível em http://localhost:5036 (mesma porta que o app usa).

services:
  postgres:
    image: postgres:17-alpine
    container_name: triar-postgres
    environment:
      POSTGRES_DB: TriarDb
      POSTGRES_USER: triar
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}"
    volumes:
      - triar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triar -d TriarDb"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: triar-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api1: &api
    build: ./Triagem.API/Triagem.API
    container_name: triar-api-1
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Database__Provider: "PostgreSQL"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=TriarDb;Username=triar;Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "${JWT_KEY:?defina JWT_KEY (>=32 caracteres) no arquivo .env}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # api2 espera a api1 ficar saudável: evita corrida na criação/seed do banco
  api2:
    <<: *api
    container_name: triar-api-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api1:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: triar-loadbalancer
    ports:
      - "5036:5036"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    restart: unless-stopped

  web:
    build: ./Triagem.Web
    ports:
      - "8080:80"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  triar-postgres-data:
